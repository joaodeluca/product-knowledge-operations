name: Publish informational help
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full commit SHA to publish
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the reviewed revision
        env:
          REVIEWED_SHA: ${{ inputs.expected_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          test "${#REVIEWED_SHA}" -eq 40
          test "$REVIEWED_SHA" = "$RUN_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate and check the public reader delivery
        run: |
          python3 scripts/build_readers.py --output "$RUNNER_TEMP/reviewed-readers"
          python3 scripts/build_readers.py --output "$RUNNER_TEMP/reviewed-readers" --check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/reviewed-readers
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
